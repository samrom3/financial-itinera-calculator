[project]
name = "fitinera"
version = "1.0.0a1"
description = "Fitinera is a Python library for mathematically validating a wide range of financial planning scenarios."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
keywords = ["finance", "planning", "simulation", "retirement"]
dependencies = [
    "numpy>=2.3.1",
    "pandas>=2.3.3",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.1",
    "pytest>=8.0.0",
]
