[project]
name = "f-itinera"
version = "0.1.0"
description = "f-Itinera planning simulator library and examples"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "itables>=2.5.2",
    "pre-commit>=4.3.0",
    "ruff>=0.14.1",
]
