fail_fast: false

repos:
  # Standard hooks for things like trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # - id: check-added-large-files
      - id: check-merge-conflict

  # Ruff for fast Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1 # Use a specific version tag
    hooks:
      # ruff format provides just formatting (optional)
      - id: ruff-format
      # ruff check provides both linting and formatting
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]

  # uv hooks for managing Python dependency files
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.3 # Use a specific version tag
    hooks:
      # Automatically syncs your uv.lock based on pyproject.toml changes
      - id: uv-lock

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-footnote==0.1.1
          - mdformat-config
          - mdformat-ruff
          - mdformat-toc

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --with pytest pytest tests
        language: system
        types: [python]
        pass_filenames: false
